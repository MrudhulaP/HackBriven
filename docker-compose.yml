version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bolkhata-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=bolkhata-production-secret-neural-nomads-2026
      - DEFAULT_LANGUAGE=hi
      - DEFAULT_CURRENCY=INR
    volumes:
      # The whole folder, not just bolkhata.db: SQLite keeps recent writes in bolkhata.db-wal.
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bolkhata-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: bolkhata-network
